# dsh-plugin-tiny-window bundle layer.
# `dsh plugin add` activates this patch automatically because package.json
# declares dsh.bundle.patch.

- insert:
    - id: tiny-window
      name: dsh-plugin-tiny-window

      # Defaults are fine. Deployment-varying values must stay configurable:
      # config:
      #   timezoneOffset: 8
      #   style: emoji
      #   windowTitle: tiny window
